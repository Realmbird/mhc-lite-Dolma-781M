[project]
name = "mhc-lite-dolma-781m"
version = "0.1.0"
description = "mHC-lite experiments scaled to 781M on Dolma"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.4",
    "numpy<2",
    "transformers>=4.44",
    "datasets>=2.20",
    "tiktoken>=0.7",
    "wandb>=0.17",
    "tqdm>=4.66",
    "einops>=0.8",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
    "accelerate>=0.33",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
